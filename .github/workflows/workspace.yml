# Private checks: the native test suite (`tests`) and the Next.js conformance fold (`conform`) live in
# muzam1l/pnext-workspace. Each job here dispatches its workspace workflow for this PR's head, waits,
# prints the run's report in this log and sets the matching commit status on the PR head.
# - tests: every push from an owner, member or collaborator; a guest PR once a maintainer adds `ok-to-test`.
# - conform: only when a maintainer adds the `conform` label; re-run it from this job.
# Runs use the workspace branch named like the PR branch when one exists, else main.
# pull_request_target so fork PRs get secrets; nothing here checks out or runs PR code.
name: workspace

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  statuses: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - id: plan
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TRUSTED: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
          OK_TO_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'ok-to-test') }}
        run: |
          if [ "$ACTION" = labeled ]; then
            case "$LABEL" in
              ok-to-test) CHECKS='["tests"]' ;;
              conform) CHECKS='["conform"]' ;;
              *) CHECKS='[]' ;;
            esac
          elif [ "$TRUSTED" = true ] || [ "$OK_TO_TEST" = true ]; then
            CHECKS='["tests"]'
          else
            CHECKS='[]'
          fi
          echo "checks=$CHECKS" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    strategy:
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ${{ matrix.check }}-${{ github.event.pull_request.number }}
      cancel-in-progress: ${{ matrix.check == 'tests' }}
    env:
      GH_REPO: muzam1l/pnext-workspace
      CHECK: ${{ matrix.check }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending -f context="$CHECK" -f description="running in pnext-workspace" -f target_url="$RUN_URL"

      - name: Run in pnext-workspace
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          KEY: pnext-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The token only has Actions access, so a missing branch is detected by the dispatch itself.
          dispatch() { gh workflow run "$CHECK.yml" --ref "$1" -f pnext_sha="$SHA" -f run_key="$KEY"; }
          WS_REF=$HEAD_REF
          if ! dispatch "$WS_REF" 2> dispatch.err; then
            grep -q 'No ref found' dispatch.err || { cat dispatch.err; exit 1; }
            WS_REF=main
            dispatch "$WS_REF"
          fi
          echo "workspace ref: $WS_REF"
          for _ in $(seq 1 24); do
            sleep 5
            RUN_ID=$(gh run list --workflow "$CHECK.yml" --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle --jq ".[] | select(.displayTitle == \"$CHECK $KEY\") | .databaseId")
            [ -n "$RUN_ID" ] && break
          done
          [ -n "$RUN_ID" ] || { echo "dispatched run never appeared"; exit 1; }
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "workspace run: https://github.com/$GH_REPO/actions/runs/$RUN_ID"
          while [ "$(gh run view "$RUN_ID" --json status --jq .status)" != completed ]; do sleep 30; done
          echo "CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" -n "$CHECK-report" -D report || true

      - name: Report
        if: always() && env.RUN_ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f report/report.md ]; then
            cat report/report.md
            cat report/report.md >> "$GITHUB_STEP_SUMMARY"
            SUMMARY=$(head -1 report/report.md | sed 's/^[^ ]* //' | cut -c1-140)
          else
            SUMMARY="no report (workspace run ${CONCLUSION:-unfinished})"
            echo "$SUMMARY"
          fi
          STATE=$([ "$CONCLUSION" = success ] && echo success || echo failure)
          gh api --silent -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" -f context="$CHECK" -f description="$SUMMARY" -f target_url="$RUN_URL"
          [ "$STATE" = success ]

      - name: Cancel workspace run
        if: cancelled() && env.RUN_ID
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
        run: gh run cancel "$RUN_ID" || true
