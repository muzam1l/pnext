# Posts the bench report of a finished PR bench run as one sticky comment, updated on every push.
# A separate workflow_run job so fork PRs get it too: it reads only the uploaded report, never PR code.
name: bench-comment

on:
  workflow_run:
    workflows: [bench]
    types: [completed]

permissions:
  actions: read
  checks: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const run = context.payload.workflow_run;
            // The PR is looked up from the run's own head, never from the artifact.
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = pulls.find(pull => pull.head.sha === run.head_sha);
            if (!pr) return core.info(`no open PR at ${run.head_sha}`);
            const body = fs.readFileSync('report/comment.md', 'utf8').slice(0, 60000);
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- bench -->'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            // The `bench` check: success only when nothing regressed, otherwise neutral; drift never fails a PR.
            let verdict = { conclusion: 'neutral', title: 'bench did not finish' };
            try { verdict = JSON.parse(fs.readFileSync('report/verdict.json', 'utf8')); } catch {}
            await github.rest.checks.create({
              ...context.repo, name: 'bench', head_sha: run.head_sha, status: 'completed',
              conclusion: verdict.conclusion === 'success' ? 'success' : 'neutral',
              output: { title: String(verdict.title).slice(0, 200), summary: body },
            });
